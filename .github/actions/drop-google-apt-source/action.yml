name: Drop the unused Google Chrome apt source
description: >-
  Removes any apt source pointing at dl.google.com, so `apt-get update` cannot
  fail the run on an index this project never reads.

runs:
  using: composite
  steps:
    # `playwright install --with-deps` runs `apt-get update` across every
    # source on the runner image, and GitHub's Ubuntu image ships Google's
    # Chrome repository. We never read it -- Playwright fetches its own
    # Chromium from Playwright's CDN -- but apt treats any failed index as
    # fatal. On 2026-09-09 that repo served a Packages.gz whose hash did not
    # match the InRelease it had just published, and every browser job died at
    # install with exit code 100 having never run a test.
    #
    # Matched on content rather than on a filename. The first attempt at this
    # deleted `/etc/apt/sources.list.d/google-chrome.list` by name, which does
    # not exist on the 24.04 image -- and because `rm -f` succeeds on a missing
    # path, the step reported success while changing nothing and the install
    # failed exactly as before.
    - name: Remove apt sources pointing at dl.google.com
      shell: bash
      run: |
        set -euo pipefail

        sudo find /etc/apt/sources.list.d -type f \
          \( -name '*.list' -o -name '*.sources' \) \
          -exec grep -lq 'dl\.google\.com' {} \; -print -delete

        # It can also live in the main list rather than in a drop-in.
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i -E 's|^([^#].*dl\.google\.com.*)$|# \1|' /etc/apt/sources.list
        fi

        # A silent no-op is the exact failure this step exists to prevent, so
        # prove the source is gone rather than assume it.
        if grep -rq 'dl\.google\.com' \
          /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
          echo "::error::A Google Chrome apt source is still configured; apt-get update will fail on its index."
          exit 1
        fi
        echo "No apt source references dl.google.com."
