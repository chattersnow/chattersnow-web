# Applies supabase/migrations/** to the hosted Supabase project.
#
# Nothing used to do this. CI only ever ran `supabase db reset` against a
# throwaway local database, so a merged migration was applied everywhere except
# the database the deployed site actually reads from. Issue #584 shipped that
# way: `public_page_visibility` existed locally and in CI but not in production,
# every read of it 404'd, and the board's page-visibility toggles looked like
# they simply refused to save.
#
# Runs on `development` as well as `main` because both branches deploy (see
# vercel.json) and both deployments point at the same Supabase project. That
# single shared database is also why the push is gated rather than automatic:
# a migration merged to a working branch reaches real donor and inventory data
# immediately. Split this to `main` only if a separate Supabase project is ever
# introduced for `development`.
name: Database migrations

on:
  push:
    branches: [main, development]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Two pushes applying migrations at once would race on the same database.
#
# Note what this group does *not* do: `cancel-in-progress: false` protects a
# run that is already running, not one that is pending. GitHub keeps a single
# pending run per group, so with the `Production` gate in the way a newer push
# silently cancels the older waiting one, jobs never started (#1058). What
# makes that survivable is `--include-all` on the push below, which lets the
# next run apply whatever the cancelled one would have.
concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # Not a secret: the same ref is already public in NEXT_PUBLIC_SUPABASE_URL.
  SUPABASE_PROJECT_REF: eorxcscxvqgiqbcrrpyj

jobs:
  # Deliberately a separate, ungated job. A GitHub environment gate blocks a
  # whole job before any step runs, so folding this into the push job would
  # mean approving with nothing to look at. Here the reviewer opens the run and
  # sees exactly which migrations are outstanding before deciding.
  plan:
    name: Pending migrations
    runs-on: ubuntu-latest
    # Not a gate -- `Preview` has no required reviewers, so this job still runs
    # unattended. It is here only because SUPABASE_ACCESS_TOKEN and
    # SUPABASE_DB_PASSWORD are environment secrets, and GitHub injects those
    # only into jobs that name an environment. Without this line the workflow's
    # `env:` block above resolves both to empty strings and `supabase link`
    # fails with "Access token not provided" before a migration is ever read.
    environment: Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `v3`, not `v1`: the v1 action declares `using: node20`, which GitHub
      # deprecated (#733) and currently runs on Node 24 under a compatibility
      # shim that will eventually go away, taking this step with it. v2 moved
      # the action to a composite and v3 installs the CLI from npm, so the
      # `version` below must be a version published as the `supabase` npm
      # package -- it is, and it is the same pin every workflow here uses.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List pending migrations
        run: |
          set -o pipefail
          {
            echo '## Pending migrations'
            echo '```'
            supabase migration list --linked
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The list above shows local against remote; this shows what the push
      # will actually do, which since #1058 is not the same question -- with
      # `--include-all` the push also picks up any migration whose version
      # sorts before the last one applied, typically one a cancelled run left
      # behind. The reviewer at the gate should be approving the real set,
      # including anything arriving out of order.
      - name: Show exactly what the push would apply
        run: |
          set -o pipefail
          {
            echo '## Would be applied'
            echo '```'
            supabase db push --include-all --dry-run
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  push:
    name: Push migrations to Supabase
    needs: plan
    runs-on: ubuntu-latest
    # Requires a reviewer on the `production` environment (repo Settings >
    # Environments). Roughly one migration in fifty here is destructive DDL --
    # 20260828050000_drop_minutes_table.sql drops a table outright, and several
    # others drop columns -- and there are no down migrations to reverse them,
    # so schema writes to the live database get a human and an audit trail.
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # `--include-all` applies any migration the remote has not recorded,
      # including one whose version sorts before the last one applied. Without
      # it the CLI refuses the whole push -- "Found local migration files to be
      # inserted before the last migration on remote database" -- and that
      # refusal is sticky: nothing retries, and every later migration is
      # blocked until someone renumbers by hand.
      #
      # A migration gets left behind more easily than it looks (#1058). The
      # push job waits on the `Production` gate, so a run spends nearly all its
      # life *pending*, and `cancel-in-progress: false` does not protect a
      # pending run -- GitHub keeps only one per concurrency group and cancels
      # the older one outright when a newer arrives, with no job ever started
      # and nothing on the run page but `cancelled`. That is how
      # 20260913000000_distribute_inventory_on_giveaway_winner.sql was skipped
      # in #1051: two merges eighteen minutes apart, one unattended approval.
      #
      # So this makes the push self-healing rather than removing the gate: a
      # displaced migration is simply applied by the next run. The cost is that
      # it can be applied after a migration written later than it, which is
      # what "out of order" means here -- acceptable because these migrations
      # are independent DDL, and far better than a schema deploy that stays
      # wedged until a human notices.
      - name: Push migrations
        run: supabase db push --include-all

      - name: Applied migrations
        run: |
          set -o pipefail
          {
            echo '## Applied migrations'
            echo '```'
            supabase migration list --linked
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
