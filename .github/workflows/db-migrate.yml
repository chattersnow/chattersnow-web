# Applies supabase/migrations/** to the hosted Supabase project.
#
# Nothing used to do this. CI only ever ran `supabase db reset` against a
# throwaway local database, so a merged migration was applied everywhere except
# the database the deployed site actually reads from. Issue #584 shipped that
# way: `public_page_visibility` existed locally and in CI but not in production,
# every read of it 404'd, and the board's page-visibility toggles looked like
# they simply refused to save.
#
# Runs on `development` as well as `main` because both branches deploy (see
# vercel.json) and both deployments point at the same Supabase project. That
# single shared database is also why the push is gated rather than automatic:
# a migration merged to a working branch reaches real donor and inventory data
# immediately. Split this to `main` only if a separate Supabase project is ever
# introduced for `development`.
name: Database migrations

on:
  push:
    branches: [main, development]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

# Two pushes applying migrations at once would race on the same database.
concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # Not a secret: the same ref is already public in NEXT_PUBLIC_SUPABASE_URL.
  SUPABASE_PROJECT_REF: eorxcscxvqgiqbcrrpyj

jobs:
  # Deliberately a separate, ungated job. A GitHub environment gate blocks a
  # whole job before any step runs, so folding this into the push job would
  # mean approving with nothing to look at. Here the reviewer opens the run and
  # sees exactly which migrations are outstanding before deciding.
  plan:
    name: Pending migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List pending migrations
        run: |
          set -o pipefail
          {
            echo '## Pending migrations'
            echo '```'
            supabase migration list --linked
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  push:
    name: Push migrations to Supabase
    needs: plan
    runs-on: ubuntu-latest
    # Requires a reviewer on the `production` environment (repo Settings >
    # Environments). Roughly one migration in fifty here is destructive DDL --
    # 20260828050000_drop_minutes_table.sql drops a table outright, and several
    # others drop columns -- and there are no down migrations to reverse them,
    # so schema writes to the live database get a human and an audit trail.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      - name: Applied migrations
        run: |
          set -o pipefail
          {
            echo '## Applied migrations'
            echo '```'
            supabase migration list --linked
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
