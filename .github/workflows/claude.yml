name: Claude Code

# On-demand only: mention @claude in a PR/issue comment or review to have
# Claude answer questions or take follow-up action. Nothing here runs on a
# plain push or PR -- automatic review was removed with the Claude Code
# Review workflow; PRs are reviewed from a local session with
# `/code-review --comment <PR number>` instead.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticate with the Claude Code OAuth token, not an API key: the
          # ANTHROPIC_API_KEY secret has no API credit behind it, which is why the
          # sibling Claude Code Review workflow failed on every PR before it was
          # removed. The OAuth token bills the Claude subscription instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
