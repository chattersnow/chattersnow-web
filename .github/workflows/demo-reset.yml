# Rebuilds the public demo tenant every night (#604).
#
# The demo hands an anonymous visitor admin inside one tenant, so whatever
# they change has to be undone on a schedule -- and one of the things they can
# change is the demo account's own password, at /portal/set-password, straight
# against GoTrue. That is why this is a GitHub Actions job rather than a
# pg_cron schedule: re-asserting the password is a GoTrue admin call, and
# Postgres cannot make one.
#
# Nothing here uses the Supabase CLI or the database password. scripts/
# demo-reset.ts talks to PostgREST and the GoTrue admin API as service_role,
# and every destructive step is gated twice: assertDemoTenant() in the script
# refuses a tenant whose plan is not 'demo' (and refuses the Chatter Snow slug
# outright), and seed_demo_tenant() refuses the same thing in its first
# statement.
name: Demo reset

on:
  schedule:
    # 09:00 UTC, which is the small hours in North America -- the demo is
    # least likely to be in front of somebody mid-click.
    - cron: "0 9 * * *"
  workflow_dispatch:

# A manual run alongside the nightly one would race on the same tenant.
concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    name: Rebuild the demo tenant
    runs-on: ubuntu-latest
    # A new environment, deliberately *not* `Production`. An environment gate
    # blocks the whole job before any step runs, so a cron job pointed at a
    # reviewed environment would sit pending approval forever and the demo
    # would quietly stop resetting. `Demo` has no required reviewers; it
    # exists only because GitHub injects environment secrets into jobs that
    # name an environment. The job can only ever touch a plan = 'demo' tenant,
    # which is what makes running it unattended safe.
    environment: Demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Not `bun run demo:reset`: that alias passes --env-file=.env.local,
      # which does not exist in a CI checkout. The environment below is the
      # env file here.
      - name: Reset the demo tenant
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_SLUG: ${{ secrets.DEMO_SLUG }}
          DEMO_HOST: ${{ secrets.DEMO_HOST }}
          DEMO_NAME: ${{ vars.DEMO_NAME }}
        run: bun scripts/demo-reset.ts
