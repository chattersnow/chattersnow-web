name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# One run per workflow per ref. A second push to a branch cancels the first
# run still working on the superseded commit, whose result nobody will read.
# `main` is exempt: that run is the deploy gate, and a push landing behind it
# must not leave the branch with no verdict at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # No job here had a timeout-minutes, so a hung one ran to GitHub's six-hour
  # default. #1288 hit that: an a11y shard stopped producing output mid-scan and
  # sat there, holding the PR's gate open, until it was cancelled by hand 33
  # minutes in -- and it would have held it for six hours unattended. The point
  # of a gate is to answer; a job that cannot answer should say so quickly.
  #
  # Each value is roughly triple the job's observed runtime, so ordinary
  # variance never trips it and a hang is caught in minutes rather than hours.
  # Raise the relevant one if a job legitimately grows into it.

  quality:
    name: Lint, Type-check, Format, Build
    runs-on: ubuntu-latest
    # Observed ~3 min.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No dependency audit here on purpose. `bun audit` fails for reasons
      # that have nothing to do with the change under review -- an advisory
      # published overnight, or the npm advisory endpoint returning 503 -- and
      # this workflow is the deploy gate, so a red X on it has to mean the
      # change is broken. The audit now runs on a daily schedule in
      # security-audit.yml; the `dependency-review` job below still blocks any
      # PR that introduces a high-severity advisory.

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      # A second of walking docs/**/*.md, and the only thing in CI that reads
      # the `](file.md#anchor)` cross-links the split spec is held together
      # with. Fourteen of them had rotted unnoticed before #1196.
      - name: Doc links
        run: bun run docs:links

      - name: Build
        run: bun run build

  unit:
    name: Unit tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Observed ~1.5 min per shard.
    timeout-minutes: 15
    # Its own job since #1170. The suite was 5m40s of the quality job's 7m38s,
    # so a lint error and a failing assertion both cost seven minutes to learn
    # about and neither result arrived until the other had finished. It had
    # also started killing the job outright: on 3ffa2da1 and #1169 the step
    # exited 1 with 289 files run and zero failures, dying partway through
    # writing the coverage table at a point that moved between runs.
    #
    # Sharded four ways: each process holds a quarter of the files, which is
    # the fix if the ceiling is runner memory and, if it isn't, at least names
    # the quarter that died. `bun test --shard=i/N` is Bun's own (1.3.14), so
    # unlike the a11y scan this needs no shard script -- and the shards are
    # disjoint and complete by construction, so no equivalent of
    # test/a11y-shard.test.ts is needed either. 4 is where the a11y job starts,
    # not a measured optimum; ~11s per shard is fixed setup, so the useful
    # ceiling here is higher and the first few runs say whether to move.
    #
    # Changing the count means changing the `shard:` matrix list and this job's
    # name together -- a matrix list can't be built from `env`, and neither can
    # a job name.
    strategy:
      # A regression in shard 2 must not cancel shards 3 and 4: the run would
      # then report one failing file and stay silent about the three quarters
      # that never ran.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No --coverage. It used to be passed here and nothing consumed it: no
      # Codecov upload, no threshold in bunfig.toml, no artifact -- the table
      # was printed into the log and read by nobody, while being the thing the
      # job died inside. Per-shard tables would have been worse than useless
      # (each covers only the files its quarter happened to import, and reads
      # like a whole-repo number), and merging lcov across shards is a moving
      # part to maintain for a number nothing gates on. If coverage is ever
      # wanted, it needs a consumer first. --isolate and the ignore patterns
      # stay in the `test` script, so `bun run test` locally is unchanged.
      - name: Unit tests
        run: bun run test --shard=${{ matrix.shard }}/4

  integration:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    # Observed ~5.5 min, most of it `supabase start`.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        # `-o env` quotes each value (KEY="value"); GITHUB_ENV takes the
        # value literally, quotes included, so strip them or every var ends
        # up wrapped in literal double quotes (e.g. a URL that then fails
        # supabase-js's http(s):// validation).
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Verify the database is migrated and seeded
        uses: ./.github/actions/verify-db-ready

      # The committed schema types are generated from this stack, so they are
      # checked here rather than in the quality job, which has no database
      # (#813 Phase 1). A stale file is how a renamed column stops being a
      # compile error and becomes `undefined` in a page at runtime.
      - name: Database types match the migrations
        run: |
          bun run db:types
          if ! git diff --quiet -- src/lib/database.types.ts; then
            echo "::error::src/lib/database.types.ts is out of date. Run 'bun run db:types' and commit the result."
            git --no-pager diff -- src/lib/database.types.ts
            exit 1
          fi

      # plpgsql static analysis over the migrated schema — unresolved
      # identifiers, type mismatches, and dead code in functions and RLS
      # policy expressions, which applying the migrations does not surface on
      # its own because Postgres only checks function bodies at execution
      # time. Reuses this job's already-running stack rather than starting
      # another; the schema it reads is the one `supabase start` built.
      - name: Lint database schema
        run: supabase db lint --level warning --fail-on error

      - name: Integration tests
        run: bun run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E tests (Playwright)
    # Sharded across a matrix in the reusable workflow (#753); the PR run stays
    # on the two Chromium-family projects, the nightly one covers all four.
    uses: ./.github/workflows/e2e.yml
    with:
      browsers: chromium,mobile-chromium
      install-browsers: chromium
      artifact-prefix: pr

  a11y:
    name: Accessibility scan ${{ matrix.shard }}/4 (axe-core)
    runs-on: ubuntu-latest
    # Observed ~8-9 min per shard, ~4 of which is fixed setup.
    timeout-minutes: 30
    # Gated on a checked-in baseline (e2e/a11y-baseline.json): known violations
    # are tolerated, new ones fail the job. Previously continue-on-error, which
    # is how #436's regression re-landed and sat unnoticed for months -- the
    # only thing that caught it was someone re-reading the console summary by
    # hand. See e2e/a11y-scan.ts and issues #240/#477.
    #
    # Sharded across runners (#844). One runner scanned 129 routes in ~900s and
    # was CI's critical path at ~19 min against 4-7 for every other job, and it
    # grew with every route added to src/app. A11Y_WORKERS was not the lever --
    # 6 workers measured no faster than 4 on a 4-vCPU runner -- so each runner
    # takes every Nth route instead. ~235s of the job is fixed setup that every
    # shard repeats (`supabase start` alone is 125s), which is what puts the
    # useful ceiling at 4: N=2 lands ~11.5 min and N=3 ~9 min, both still over
    # the 8 min target, and N=5 would buy 45s for a fifth Postgres.
    #
    # Changing the count means changing A11Y_SHARD_TOTAL, the `shard:` matrix
    # list and this job's name together -- a matrix list can't be built from
    # `env`, and neither can a job name.
    env:
      A11Y_SHARD_TOTAL: "4"
    strategy:
      # A regression in shard 2 must not cancel shards 3 and 4: the run would
      # then report one failing route and stay silent about every route that
      # never got scanned -- which is the shape #436 had.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Verify the database is migrated and seeded
        uses: ./.github/actions/verify-db-ready

      - name: Drop the unused Google Chrome apt source
        uses: ./.github/actions/drop-google-apt-source

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      # Built and served rather than `next dev` (#744): under the dev server
      # every route was compiled on demand by whichever pass reached it first,
      # and that cost landed inside the scan. NEXT_PUBLIC_* are inlined at
      # build time, so they belong on this step, not just on `start`.
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Start server
        run: |
          bun run start > server.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:3000/home > /dev/null; do sleep 2; done'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Accessibility scan
        # Two independent axes. A11Y_WORKERS splits this runner's routes across
        # browser contexts (#751); A11Y_SHARD picks which routes this runner
        # owns at all (#844). Both are set explicitly rather than left to the
        # script's defaults so the run's shape is visible here.
        #
        # A11Y_WORKERS stays at 4 on purpose: raising it to 6 was measured on
        # this job and scanned 860s against 4 workers' 844s on the same commit,
        # so the runner is saturated and six Chromium contexts is only more
        # memory. See #844 for the numbers.
        run: bun run test:a11y:check
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          A11Y_WORKERS: "4"
          A11Y_SHARD: ${{ matrix.shard }}/${{ env.A11Y_SHARD_TOTAL }}

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per shard: four jobs uploading `a11y-report` would collide, and
          # each report only describes its own routes anyway. They are not
          # merged -- nothing reads them programmatically, and the gate is each
          # shard's own exit code, not the artifact.
          name: a11y-report-${{ matrix.shard }}
          path: e2e/a11y-report.json
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Observed seconds.
    timeout-minutes: 10
    # Diffs the PR's dependency changes against the base branch and blocks
    # newly *introduced* vulnerabilities. This is the per-PR complement to the
    # whole-tree `bun audit` in security-audit.yml: a PR that adds a vulnerable
    # package fails here even while the existing tree is clean. It stays in the
    # gate because it is change-scoped and reads GitHub's own dependency graph
    # rather than the npm advisory endpoint.
    #
    # Requires the repository dependency graph. If this job starts failing
    # with "Dependency review is not supported on this repository", that
    # setting has been turned off rather than the workflow being wrong.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
