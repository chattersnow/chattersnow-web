name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  quality:
    name: Lint, Type-check, Format, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails the build on a high or critical advisory in the dependency
      # tree. Dependabot's weekly PRs are what normally keep this green; if a
      # new advisory lands with no fix available yet, add `--ignore <CVE>`
      # here with a comment rather than dropping the severity threshold.
      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test --coverage

      - name: Build
        run: bun run build

  integration:
    name: Integration tests (Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        # `-o env` quotes each value (KEY="value"); GITHUB_ENV takes the
        # value literally, quotes included, so strip them or every var ends
        # up wrapped in literal double quotes (e.g. a URL that then fails
        # supabase-js's http(s):// validation).
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Reset DB (migrate + seed)
        run: supabase db reset

      # plpgsql static analysis over the migrated schema — unresolved
      # identifiers, type mismatches, and dead code in functions and RLS
      # policy expressions, which `supabase db reset` alone will not surface
      # because Postgres only checks function bodies at execution time.
      # Reuses this job's already-running stack rather than starting another.
      - name: Lint database schema
        run: supabase db lint --level warning --fail-on error

      - name: Integration tests
        run: bun run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Reset DB (migrate + seed)
        run: supabase db reset

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e:pr
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop

  a11y:
    name: Accessibility scan (axe-core, report only)
    runs-on: ubuntu-latest
    # Findings-only: never blocks the build. See e2e/a11y-scan.ts and issue #240.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Reset DB (migrate + seed)
        run: supabase db reset

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          bun run dev > dev-server.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:3000/home > /dev/null; do sleep 2; done'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Accessibility scan
        run: bun run test:a11y
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: e2e/a11y-report.json
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: supabase stop

  # A `dependency-review` job belongs here, to block PRs that introduce a
  # vulnerable dependency (the per-PR complement to the whole-tree `bun audit`
  # step above). It is left out for now because this repository has no
  # dependency graph — the action fails with "Dependency review is not
  # supported on this repository", and /dependency-graph/sbom returns 404.
  # Enable the dependency graph under Settings > Advanced Security (it may be
  # disabled at the organization level), then add the job back.
