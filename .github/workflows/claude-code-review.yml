name: Claude Code Review

# Automatically reviews every pull request into development/main with
# Claude, posting findings as inline comments on the diff.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [development, main]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Pin the model. With no --model the CLI defaults to
          # claude-opus-5[1m]; every run died in ~400ms with no model call
          # and no cost, the shape of an instant API rejection.
          claude_args: '--model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
