name: CodeQL

# Static application security testing. This is CodeQL's "advanced setup":
# a committed workflow rather than the Settings toggle, so it needs no
# repository configuration and works the same on every fork and branch.
# CodeQL is free and unlimited on public repositories.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Weekly re-scan so newly published queries reach existing code even
    # when nothing has been pushed.
    - cron: "27 4 * * 1"

# One run per workflow per ref. A second push to a branch cancels the first
# run still working on the superseded commit, whose result nobody will read.
# `main` is exempt: its scan is what populates the security tab, and a push
# landing behind it must not leave the branch unscanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity security queries on top of
          # the default set. Quality queries are deliberately left out — that
          # ground is already covered by ESLint and tsc in the CI workflow.
          queries: security-extended

      # No build step: CodeQL analyzes JS/TS from source, and `next build`
      # output would add nothing it can use.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
