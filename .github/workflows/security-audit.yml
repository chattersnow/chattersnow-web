name: Security audit (dependencies)

# `bun audit` against the whole dependency tree, kept deliberately OUT of the
# CI workflow. Two reasons:
#
#  1. It is time-based, not change-based. An advisory published overnight turns
#     an untouched branch red, so an audit failure says nothing about the code
#     under review. CI is the deploy gate; a red X there has to mean "this
#     change is broken".
#  2. It talks to the npm advisory endpoint, which is flaky. Every audit
#     failure observed on CI in the days before this split was transport, not
#     findings -- `ConnectionClosed: audit request failed` and
#     `audit request failed (status 503)`, roughly 30% of runs, each burning
#     ~5 minutes of the quality job before failing. Hence the retry loop below.
#
# Per-PR cover is unchanged: the `dependency-review` job in ci.yml still blocks
# a PR that *introduces* a high-severity advisory, and it reads GitHub's own
# dependency graph rather than the npm endpoint.

on:
  schedule:
    # Daily, offset from the nightly E2E run.
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails on a high or critical advisory in the dependency tree.
      # Dependabot's weekly PRs are what normally keep this green; if a new
      # advisory lands with no fix available yet, add `--ignore <CVE>` here
      # with a comment rather than dropping the severity threshold.
      #
      # `bun audit` has no retry of its own, so wrap it: a transport error
      # always prints "audit request failed", which is retried; anything else
      # non-zero is a real finding and fails immediately. Retry exhaustion is
      # reported as infrastructure (`audit-status=unavailable`), not as a
      # vulnerability, so it never files a false issue.
      - name: Audit dependencies
        id: audit
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            output=$(bun audit --audit-level=high 2>&1)
            status=$?
            echo "$output"
            if [ "$status" -eq 0 ]; then
              echo "audit-status=clean" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! printf '%s' "$output" | grep -q 'audit request failed'; then
              {
                echo "audit-status=vulnerable"
                echo "report<<AUDIT_REPORT_EOF"
                printf '%s\n' "$output"
                echo "AUDIT_REPORT_EOF"
              } >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::Attempt $attempt: npm advisory endpoint unreachable, retrying."
            sleep $((attempt * 15))
          done
          echo "audit-status=unavailable" >> "$GITHUB_OUTPUT"
          echo "::error::Could not reach the npm advisory endpoint after 5 attempts. No vulnerability information was obtained; this is not a finding."
          exit 1

      # A scheduled workflow that only goes red in the Actions tab is a
      # workflow nobody reads. Real findings get an issue; the title is fixed
      # so consecutive runs comment on the one issue instead of filing a new
      # one every day.
      - name: File or update advisory issue
        if: failure() && steps.audit.outputs.audit-status == 'vulnerable'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.audit.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Dependency audit: high or critical advisory in the dependency tree"
        run: |
          body=$(printf '`bun audit --audit-level=high` failed on `%s`.\n\n```\n%s\n```\n\n[Workflow run](%s)\n' \
            "$GITHUB_REF_NAME" "$REPORT" "$RUN_URL")
          existing=$(gh issue list --state open --search "in:title $TITLE" --json number,title \
            --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
