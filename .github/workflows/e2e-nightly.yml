name: E2E nightly (full browser matrix)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  e2e-full-matrix:
    name: E2E tests (Playwright, all projects)
    # Same sharded shape as the PR run (#753), with no E2E_BROWSERS so all four
    # browser projects run. This suite is twice the size of the PR one and
    # nobody is waiting on it, but the runner minutes are free either way.
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-prefix: nightly
