name: E2E nightly (full browser matrix)

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  e2e-full-matrix:
    name: E2E tests (Playwright, all projects)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Load Supabase env
        run: supabase status -o env | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Reset DB (migrate + seed)
        run: supabase db reset

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: E2E tests (full matrix)
        run: bun run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SECRET_KEY }}
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop
